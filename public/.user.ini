; php2shell（CVE-2026-109618 / CVE-2026-109619）緩和策
; Session Upload Progress 機能を無効化し、厳格なセッションIDモードを有効化する。
; contact.php はセッション・ファイルアップロードを使用しないため機能上の影響はない。
;
; ※緩和策であり完全な防御ではない。PHP 修正版（8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 以降）
;   へのバージョンアップが根本対策。
; ※ CGI/FastCGI 構成（Lolipop 等）ではこのファイルがディレクトリ単位で有効。
;   反映には最大 user_ini.cache_ttl（デフォルト300秒）かかる場合がある。
session.upload_progress.enabled = 0
session.use_strict_mode = 1

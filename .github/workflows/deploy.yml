name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:github-pages
        env:
          GITHUB_PAGES: "true"
          # GitHub Pagesではcanonical・OGP・faviconの基準ドメインを明示する。
          # 独自ドメインへ移行する場合は、リポジトリのSecrets/Variablesで上書きする。
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://mori-tt.github.io' }}
          NEXT_PUBLIC_SITE_INDEXABLE: "false"
          NEXT_PUBLIC_PUBLICATION_MODE: "preview"
          # GitHub Pagesは未来記事を含む全記事の確認用ビルド。
          NEXT_PUBLIC_ARTICLE_BUILD_MODE: "all"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

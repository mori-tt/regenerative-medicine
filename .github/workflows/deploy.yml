name: Deploy to GitHub Pages

# デプロイ先はリポジトリ Variable DEPLOY_TARGET で切り替える:
#   github-pages（未設定時の既定）= Pagesのみ / both = 両方 / lolipop = Lolipopのみ / none = どちらも止める
# Lolipop側のデプロイは deploy-lolipop.yml が担当。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # DEPLOY_TARGET が 'lolipop' または 'none' のときスキップ。
    # 未設定・'github-pages'・'both' なら実行する（未設定時は従来どおりPagesのみデプロイ）。
    if: ${{ vars.DEPLOY_TARGET != 'lolipop' && vars.DEPLOY_TARGET != 'none' }}
    # 既定は GitHub hosted。repo 変数 CI_RUNNER=self-hosted で自分の Mac の runner で実行する（未設定に戻せば hosted に戻る）
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Validate DEPLOY_TARGET
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          case "${DEPLOY_TARGET:-github-pages}" in
            github-pages|lolipop|both|none)
              echo "DEPLOY_TARGET='${DEPLOY_TARGET:-<unset:github-pages>}'"
              ;;
            *)
              echo "::error::Unknown DEPLOY_TARGET='${DEPLOY_TARGET}'. Expected: github-pages | lolipop | both | none"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build:github-pages
          npm run check:export
        env:
          GITHUB_PAGES: "true"
          # GitHub Pagesではcanonical・OGP・faviconの基準ドメインを明示する。
          # 独自ドメインへ移行する場合は、リポジトリのSecrets/Variablesで上書きする。
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://mori-tt.github.io' }}
          NEXT_PUBLIC_SITE_INDEXABLE: "false"
          NEXT_PUBLIC_LOCALIZED_INDEXABLE: "false"
          NEXT_PUBLIC_PUBLICATION_MODE: "preview"
          # GitHub Pagesは未来記事を含む全記事の確認用ビルド。
          NEXT_PUBLIC_ARTICLE_BUILD_MODE: "all"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    # 既定は GitHub hosted。repo 変数 CI_RUNNER=self-hosted で自分の Mac の runner で実行する（未設定に戻せば hosted に戻る）
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
